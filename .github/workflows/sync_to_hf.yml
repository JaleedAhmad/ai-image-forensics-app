name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Create a fresh git repo to push without GitHub history 
          # (this avoids HF rejecting the push due to large files from past commits)
          mkdir hf_deploy
          rsync -a --exclude='.git' --exclude='hf_deploy' --exclude='__pycache__' --exclude='.pytest_cache' --exclude='venv' ./ hf_deploy/
          cd hf_deploy
          git init
          git checkout -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add hf https://Jaleed02:$HF_TOKEN@huggingface.co/spaces/Jaleed02/neural-forensics
          
          # Tell Git to use LFS for binary files so Hugging Face doesn't reject them
          git lfs install
          git lfs track "*.png" "*.jpg" "*.jpeg" "*.ico" "*.svg" "*.pyc" "*.so"
          git add .gitattributes
          
          git add .
          git commit -m "Deploy from GitHub Actions"
          git push --force hf main
