name: Hugging Face Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installing requests which is used in our script (and also present in backend/requirements.txt)
          pip install requests

      - name: Run keep-alive script
        env:
          # HF_BACKEND_URL must be set in repository secrets or variables
          HF_BACKEND_URL: ${{ secrets.HF_BACKEND_URL }}
        run: |
          python scripts/keep_alive.py
